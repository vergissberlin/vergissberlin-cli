name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Configure gem credentials
        run: |
          mkdir -p ~/.gem
          cat <<EOF > ~/.gem/credentials
          ---
          :rubygems_api_key: ${{ secrets.RUBYGEMS_API_KEY }}
          :github: Bearer ${{ secrets.GITHUB_TOKEN }}
          EOF
          chmod 0600 ~/.gem/credentials

      - name: Build gem
        run: gem build vergissberlin.gemspec

      - name: Publish to RubyGems.org
        run: gem push vergissberlin-*.gem

      - name: Publish to GitHub Packages
        run: |
          gem push --key github \
            --host "https://rubygems.pkg.github.com/${{ github.repository_owner }}" \
            vergissberlin-*.gem

  update-homebrew-tap:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Update Formula/vergissberlin.rb in vergissberlin/homebrew-tap
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          url="https://github.com/${{ github.repository }}/archive/refs/tags/${TAG}.tar.gz"
          sha256=$(curl -sL "$url" | sha256sum | cut -d' ' -f1)

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/vergissberlin/homebrew-tap.git" tap
          cd tap

          sed -i \
            -e "s#url \".*vergissberlin-cli/archive/refs/tags/v[^\"]*\"#url \"${url}\"#" \
            -e "s#sha256 \"[a-f0-9]\{64\}\"#sha256 \"${sha256}\"#" \
            Formula/vergissberlin.rb

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet Formula/vergissberlin.rb && exit 0
          git commit -am "chore: bump vergissberlin formula to ${version}"
          git push origin main
